{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="empty" style="margin-top:80px;text-align:center">
  <div class="emoji" style="font-size:4rem">🍽️</div>
  <h2 style="margin-top:12px">Oops — {{ code }}</h2>
  <p class="muted" style="max-width:420px;margin:10px auto">{{ message }}</p>
  <a href="/" class="btn btn-primary mt">← Back to home</a>
</div>
{% endblock %}
